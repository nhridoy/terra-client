<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TermVault</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .logo {
        font-size: 28px;
        font-weight: 700;
        color: #fafafa;
        letter-spacing: -0.5px;
      }
      .logo span {
        color: #0ea5e9;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid rgba(255, 255, 255, 0.1);
        border-top-color: #0ea5e9;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .status {
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo">Term<span>Vault</span></div>
      <div class="spinner"></div>
      <div class="status">Initializing...</div>
    </div>
  </body>
</html>
